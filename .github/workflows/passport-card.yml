name: Passport Carry-Card

on:
  push:
    paths:
      - ".eczid/**"
      - "passport-card.schema.json"
      - "scripts/validate_passport_card.py"
      - "scripts/test_validate_passport_card.py"
      - ".github/workflows/passport-card.yml"
  pull_request:
    paths:
      - ".eczid/**"
      - "passport-card.schema.json"
      - "scripts/validate_passport_card.py"
      - "scripts/test_validate_passport_card.py"
      - ".github/workflows/passport-card.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Parse JSON Schema
        run: python -m json.tool passport-card.schema.json > /dev/null
      - name: Validate reference Carry-Card
        run: python scripts/validate_passport_card.py .eczid/passport-card.example.json --allow-example
      - name: Run validator contract regressions
        run: python -m unittest scripts/test_validate_passport_card.py
